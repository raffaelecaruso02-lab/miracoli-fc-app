<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miracoli FC</title>
<meta name="theme-color" content="#7B1123">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Miracoli FC">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bord:#7B1123; --bord-deep:#660B1A; --cel:#5BC0EB; --cel-lt:#78D5FA;
  --ink:#1E293B; --soft:#64748B; --line:#E2E8F0; --ice:#F8FAFC; --surf:#fff;
  --ok:#15803D; --no:#BE123C; --warn:#D97706; --neutral:#334155;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ice);color:var(--ink);font-family:Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
h1,h2,h3,.num{font-family:Archivo,sans-serif;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--cel);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.wrap{max-width:560px;margin:0 auto}

/* header */
header{background:var(--bord);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-top));
  position:sticky;top:0;z-index:30}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:16px;margin:0;font-weight:800}
header .sub{font-size:11px;color:var(--cel-lt);margin-top:1px}
select.team{background:rgba(255,255,255,.14);border:0;border-radius:9px;color:#fff;
  padding:8px 10px;font-size:13px;max-width:190px}
select.team option{color:#000}
.iconbtn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;font-size:17px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surf);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:9px 4px 11px;font-size:11px;font-weight:600;color:var(--soft);
  display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:21px;height:21px}
nav button[aria-current="true"]{color:var(--bord)}

main{padding:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 3px;font-size:15px}
.muted{color:var(--soft);font-size:13px}
.empty{text-align:center;padding:34px 18px;color:var(--soft);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}

.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
  border-radius:12px;padding:13px;font-weight:700;font-size:14.5px}
.btn.primary{background:var(--bord);color:#fff}
.btn.accent{background:var(--cel);color:#0F172A}
.btn.ghost{background:var(--ice);color:var(--soft);border:1px solid var(--line)}
.btn.wa{background:#25D366;color:#053}
.btn:disabled{background:var(--line);color:var(--soft);cursor:not-allowed}
.btn.sm{padding:9px 13px;font-size:13px;width:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

label{display:block;font-size:12px;font-weight:600;color:var(--soft);margin:11px 0 4px}
input,select,textarea{width:100%;background:var(--surf);border:1px solid var(--line);
  border-radius:11px;padding:11px;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cel);
  box-shadow:0 0 0 3px rgba(91,192,235,.25)}
textarea{resize:vertical}

/* appello */
.sess{background:var(--bord);color:#fff;border-radius:16px;padding:14px;margin-bottom:12px}
.sess .top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.sess input[type=date]{background:rgba(255,255,255,.15);border:0;color:#fff;padding:8px 10px;
  border-radius:9px;font-size:13px;width:auto}
.tally{text-align:right;line-height:1}
.tally .num{font-size:30px;font-weight:800;color:var(--cel-lt);font-variant-numeric:tabular-nums}
.tally .num small{font-size:15px;color:rgba(255,255,255,.5)}
.tally p{margin:4px 0 0;font-size:11px;color:rgba(255,255,255,.65)}
.prog{height:5px;background:rgba(255,255,255,.2);border-radius:99px;margin-top:11px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--cel);transition:width .25s}

.plist{list-style:none;margin:0;padding:0}
.plist li{background:var(--surf);border:1px solid var(--line);border-radius:14px;
  padding:10px 12px 12px;margin-bottom:9px}
.who{display:flex;align-items:center;gap:10px}
.jersey{width:34px;height:34px;flex:none;border-radius:9px;background:var(--ice);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-family:Archivo;font-weight:800;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.who .nm{flex:1;min-width:0}
.who .nm b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flag{display:inline-block;margin-top:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px}
.flag.exp{background:#FFE4E6;color:#BE123C}
.flag.soon{background:#FEF3C7;color:#B45309}
.notetxt{font-size:11.5px;color:var(--soft);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{width:36px;height:36px;border-radius:9px;color:var(--soft);flex:none;font-size:15px}
.states{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.states button{height:50px;border-radius:11px;background:var(--ice);border:1px solid var(--line);
  color:var(--soft);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;transition:transform .07s}
.states button:active{transform:scale(.94)}
.states button svg{width:18px;height:18px}
.states button[aria-pressed="true"]{color:#fff;border-color:transparent}
.states [data-s=P][aria-pressed="true"]{background:var(--ok)}
.states [data-s=A][aria-pressed="true"]{background:var(--no)}
.states [data-s=G][aria-pressed="true"]{background:var(--warn)}
.states [data-s=I][aria-pressed="true"]{background:var(--neutral)}
.counts{display:flex;justify-content:space-between;font-size:11.5px;color:var(--soft);margin:2px 0 10px}
.counts b{font-family:Archivo;color:var(--ink)}

/* report */
.barline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.barline:last-child{border:0}
.barline .nm{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{width:78px;height:7px;background:var(--ice);border-radius:99px;overflow:hidden;flex:none}
.track i{display:block;height:100%;background:var(--ok)}
.track i.mid{background:var(--warn)}
.track i.low{background:var(--no)}
.pct{width:42px;text-align:right;font-family:Archivo;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}

/* gare */
.match{border-left:4px solid var(--bord)}
.match .when{font-family:Archivo;font-weight:800;font-size:20px;color:var(--bord)}
.chiplist{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chip{border:1px solid var(--line);background:var(--ice);border-radius:9px;padding:7px 11px;
  font-size:13px;font-weight:600;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--bord);border-color:var(--bord);color:#fff}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .in{background:var(--surf);width:100%;max-width:560px;margin:0 auto;
  border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 2px;font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);
  color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;z-index:70;opacity:0;
  pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.pre{background:var(--ice);border:1px solid var(--line);border-radius:11px;padding:12px;
  font-size:13px;line-height:1.5;white-space:pre-wrap;margin-top:10px}

/* ===== matchday ===== */
.mdbar{display:flex;gap:7px;margin-bottom:11px}
.mdbar button{flex:1;border-radius:11px;padding:10px 4px;font-size:13px;font-weight:700;
  background:var(--surf);border:1px solid var(--line);color:var(--soft)}
.mdbar button small{display:block;font-size:10.5px;font-weight:600;opacity:.65;margin-top:1px}
.mdbar button[aria-pressed="true"]{background:var(--bord);border-color:var(--bord);color:#fff}
.pitch{position:relative;width:100%;aspect-ratio:3/4;border-radius:16px;overflow:hidden;
  background:linear-gradient(175deg,#2F7A44,#256235);margin-bottom:10px}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
  align-items:center;gap:3px;width:62px}
.slot .bub{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-family:Archivo;font-weight:800;font-size:14px;
  border:2px dashed rgba(255,255,255,.45);color:rgba(255,255,255,.7);background:rgba(255,255,255,.1)}
.slot.full .bub{background:var(--bord);color:#fff;border:2px solid rgba(255,255,255,.75)}
.slot .lb{max-width:100%;font-size:10px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);
  padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plrow{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid var(--line)}
.plrow:last-child{border:0}
.plrow .nm{flex:1;min-width:0}
.plrow .nm b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plrow .nm span{font-size:11px;color:var(--soft)}
.plrow.on{background:#ECFDF5;border-radius:9px;padding-left:7px;padding-right:7px}
.cnt{display:flex;align-items:center;gap:4px;flex:none}
.cnt .add{height:34px;min-width:38px;border-radius:9px;background:var(--bord);color:#fff;
  font-size:12.5px;font-weight:800;padding:0 8px}
.cnt .add.alt{background:var(--neutral)}
.cnt .sub{width:26px;height:26px;border-radius:7px;background:var(--ice);color:var(--soft);font-size:15px}
.mini-in{width:46px;padding:7px 4px;text-align:center;font-size:13px}
.minbar{display:flex;align-items:center;gap:8px;padding:5px 0}
.minbar .nm{width:110px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minbar .tr{flex:1;height:7px;background:var(--ice);border-radius:99px;overflow:hidden}
.minbar .tr i{display:block;height:100%;background:var(--cel)}
.minbar .tr i.zero{background:var(--no)}
.minbar .vl{width:38px;text-align:right;font-family:Archivo;font-weight:700;font-size:13px}
.backlink{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
  color:var(--soft);margin-bottom:10px}

/* ===== convocazione ===== */
.convrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.convrow:last-child{border:0}
.convrow .nm{flex:1;min-width:0}
.convrow .nm b{display:block;font-size:14.5px;font-weight:600}
.convrow .nm span{font-size:11.5px;color:var(--soft)}
.tick{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:16px;color:transparent}
.convrow[aria-pressed="true"] .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.freq{font-family:Archivo;font-weight:700;font-size:12px;padding:3px 8px;border-radius:7px;flex:none}
.freq.hi{background:#DCFCE7;color:#15803D}
.freq.mid{background:#FEF3C7;color:#B45309}
.freq.lo{background:#FFE4E6;color:#BE123C}
.preview{width:100%;border:1px solid var(--line);border-radius:12px;margin-top:12px;display:block}

/* ===== restyle ===== */
:root{
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow:0 1px 3px rgba(15,23,42,.07), 0 8px 24px -16px rgba(15,23,42,.35);
  --navy:#16233A;
}
body{background:#EEF2F7}
.phone,main{scroll-behavior:smooth}
header{background:linear-gradient(160deg,#8A1528 0%,var(--bord) 45%,var(--bord-deep) 100%);
  box-shadow:0 6px 20px -12px rgba(102,11,26,.9)}
.card{border-color:rgba(226,232,240,.9);box-shadow:var(--shadow-sm);border-radius:18px;
  transition:box-shadow .2s ease}
.card:hover{box-shadow:var(--shadow)}
.btn{transition:transform .12s ease, box-shadow .2s ease, background .2s ease, opacity .2s}
.btn:not(:disabled):hover{box-shadow:var(--shadow)}
.btn:not(:disabled):active{transform:scale(.985)}
.btn.primary{background:linear-gradient(180deg,#8A1528,var(--bord))}
.btn.accent{background:linear-gradient(180deg,#6FC9F0,var(--cel))}
nav button{transition:color .18s ease}
nav button[aria-current="true"]{position:relative}
nav button[aria-current="true"]::before{content:"";position:absolute;top:0;left:50%;
  transform:translateX(-50%);width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--bord)}
.plist li{box-shadow:var(--shadow-sm);border-radius:16px;transition:box-shadow .2s}
.states button{transition:transform .08s ease, background .15s ease, color .15s ease}
.jersey{background:linear-gradient(180deg,#fff,var(--ice));box-shadow:inset 0 0 0 1px rgba(226,232,240,.9)}
.freq,.flag{letter-spacing:.01em}

/* pillole di esito */
.freq.hi{background:#DCFCE7;color:#166534;box-shadow:inset 0 0 0 1px rgba(22,101,52,.12)}
.freq.mid{background:#FEF3C7;color:#92400E;box-shadow:inset 0 0 0 1px rgba(146,64,14,.12)}
.freq.lo{background:#FFE4E6;color:#9F1239;box-shadow:inset 0 0 0 1px rgba(159,18,57,.12)}

/* campo: erba a strisce e badge curati */
.pitch{background:#2C7A45;box-shadow:inset 0 0 60px rgba(0,0,0,.28);aspect-ratio:3/4}
.pitch::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.055) 0 8.5%,rgba(0,0,0,.045) 8.5% 17%)}
.slot .bub{box-shadow:0 3px 10px rgba(0,0,0,.32);transition:transform .12s ease}
.slot:active .bub{transform:scale(.93)}
.slot.full .bub{background:linear-gradient(180deg,#8A1528,var(--bord-deep));
  border:2px solid rgba(255,255,255,.85)}
.slot .lb{backdrop-filter:blur(2px);font-weight:700;letter-spacing:.01em}

/* pulsante in attesa */
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;
  border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .7s linear infinite}
.btn.ghost .spin{border-color:rgba(100,116,139,.3);border-top-color:var(--soft)}
@keyframes sp{to{transform:rotate(360deg)}}
.btn:disabled{opacity:.75}

@media (min-width:640px){
  .phone{max-width:620px;border-radius:0 0 22px 22px}
  main{padding:18px}
  .pitch{aspect-ratio:4/3}
}

/* ===== editor note convocazione ===== */
.noterow{border:1px solid rgba(226,232,240,.9);border-left-width:5px;border-radius:14px;
  padding:11px 12px;margin-bottom:11px;box-shadow:var(--shadow-sm)}
.noterow textarea{border:0;background:transparent;padding:0;font-size:15.5px;line-height:1.45;
  width:100%;resize:none}
.noterow textarea:focus{outline:none;box-shadow:none}
.notetools{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:8px;border:1px solid rgba(15,23,42,.15);flex:none;
  transition:transform .1s}
.sw:active{transform:scale(.9)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.tg{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surf);
  font-size:12.5px;font-weight:700;color:var(--soft)}
.tg[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tg.del{margin-left:auto;color:var(--no);border-color:#FECDD3}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bar">
      <div>
        <h1 id="clubname">Miracoli FC</h1>
        <div class="sub" id="clubsub">Campo dei Miracoli</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <select class="team" id="teamsel" onchange="pickTeam(this.value)"></select>
        <button class="iconbtn" onclick="openSettings()" aria-label="Impostazioni">⚙</button>
      </div>
    </div>
  </header>

  <main id="view"></main>

  <nav>
    <button data-tab="appello" onclick="go('appello')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l2 2 4-4"/><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4"/></svg>
      Appello</button>
    <button data-tab="gare" onclick="go('gare')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7l4.5 3.3-1.7 5.3h-5.6L7.5 10.3z"/></svg>
      Gare</button>
    <button data-tab="rosa" onclick="go('rosa')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.9"/></svg>
      Rosa</button>
    <button data-tab="report" onclick="go('report')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Report</button>
  </nav>
</div>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="in" id="sheetin"></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============ ARCHIVIO ============
   Tutto vive in localStorage, sul telefono di chi usa l'app.
   Nessun server, nessun account. Il rovescio della medaglia è che
   un backup ogni tanto è indispensabile: lo fai da Impostazioni. */

const KEY = "miracolifc.v1";
const BLANK = { club:"Miracoli FC", site:"Campo dei Miracoli", coach:"", phone:"", noteConv:"",
                logo:null, logoC:null, logoR:null, notes:null, lastBackup:null, teams:[], players:[],
                sessions:[], att:{}, matches:[], current:null };
let db = load();
let tab = "appello";

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(BLANK);
    return Object.assign(structuredClone(BLANK), JSON.parse(raw));
  }catch(e){ return structuredClone(BLANK); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ toast("Memoria piena: fai un backup ed elimina gli allenamenti vecchi"); }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function today(){ return new Date().toISOString().slice(0,10); }

/* ============ UTILITÀ ============ */
const E = s => String(s??"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICO = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const STATE = {
  P:{lab:"Presente", ico:ICO('<path d="M20 6 9 17l-5-5"/>')},
  A:{lab:"Assente",  ico:ICO('<path d="M18 6 6 18M6 6l12 12"/>')},
  G:{lab:"Giustif.", ico:ICO('<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>')},
  I:{lab:"Infort.",  ico:ICO('<path d="M3 12h4l2-5 3 10 2-5h7"/>')}
};
function dLong(iso){
  return new Date(iso+"T12:00").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
}
function dShort(iso){
  return new Date(iso+"T12:00").toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit"});
}
let toastT;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("on"), 2600);
}
function certState(p){
  if(!p.cert) return "missing";
  const d = Math.round((new Date(p.cert) - new Date(today()))/86400000);
  if(d < 0) return "expired";
  if(d <= 30) return "soon";
  return "ok";
}

/* ============ SELEZIONI ============ */
const team = () => db.teams.find(t => t.id === db.current) || null;
const roster = () => db.players.filter(p => p.teamId === db.current)
                               .sort((a,b)=> (a.last+a.first).localeCompare(b.last+b.first,"it"));
function sessionFor(date){
  return db.sessions.find(s => s.teamId === db.current && s.date === date);
}
function ensureSession(date){
  let s = sessionFor(date);
  if(!s){ s = {id:uid(), teamId:db.current, date, pitch:"Campo A", closed:false};
          db.sessions.push(s); db.att[s.id] = {}; save(); }
  if(!db.att[s.id]) db.att[s.id] = {};
  return s;
}

  sheet(`<h3>Aggiungi in blocco</h3>

Caruso Mattia, 11

function saveBulk(){
  const lines = document.getElementById("bulk").value.split("\n").map(s=>s.trim()).filter(Boolean);
  let n = 0;
  lines.forEach(line => {
    const [namePart, numPart] = line.split(",");
    const bits = namePart.trim().split(/\s+/);
    if(!bits.length) return;
    const first = bits.length > 1 ? bits.pop() : "";
    db.players.push({id:uid(), teamId:db.current, last:bits.join(" "), first,
                     num: numPart ? numPart.trim() : null, cert:null});
    n++;
  });
  save(); closeSheet(); render(); toast(n + " atleti aggiunti");
}

/* ============ ALLENAMENTI ============ */
/* Gli allenamenti si creano in anticipo e si aprono il giorno che
   servono: a bordo campo non si ha voglia di compilare un modulo. */

let curSess = null;
const sessById = id => db.sessions.find(s => s.id === id);
function attOf(s){ if(!db.att[s.id]) db.att[s.id] = {}; return db.att[s.id]; }

function sessCounts(s){
  const a = db.att[s.id] || {};
  const r = roster();
  const c = {P:0,A:0,G:0,I:0}; let done = 0;
  r.forEach(p => { const st = a[p.id]?.s; if(st){ c[st]++; done++; } });
  return {...c, done, tot:r.length};
}

/* --- elenco --- */
function viewAppello(){
  if(!roster().length) return `<div class="card"><div class="empty">
    <b>Prima la rosa</b>Aggiungi gli atleti dalla scheda Rosa, poi torna qui.</div></div>`;

  const ss = db.sessions.filter(s => s.teamId === db.current).sort((a,b)=>b.date.localeCompare(a.date));
  const t = today();
  const next = ss.filter(s => s.date >= t).sort((a,b)=>a.date.localeCompare(b.date));
  const past = ss.filter(s => s.date < t);

  const card = s => {
    const c = sessCounts(s);
    const fatto = c.done > 0;
    return `<div class="card" style="border-left:4px solid ${fatto?"var(--ok)":"var(--cel)"}">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <div style="flex:1;min-width:0">
          <h2 style="text-transform:capitalize">${dLong(s.date)}</h2>
          <p class="muted">${s.time || "17:30"} · ${E(s.pitch || "Campo A")}${
            fatto ? ` · <b style="color:var(--ok)">${c.P}/${c.tot} presenti</b>` : " · appello da fare"}</p>
          ${s.notes ? `<p class="muted" style="margin-top:4px">${E(s.notes)}</p>` : ""}
        </div>
        <button class="mini" onclick="editSession('${s.id}')" aria-label="Modifica">✎</button>
      </div>
      <button class="btn ${fatto?"ghost":"primary"} sm" style="width:100%;margin-top:10px"
        onclick="openSess('${s.id}')">${fatto ? "Rivedi l'appello" : "Fai l'appello"}</button>
    </div>`;
  };

  return `
  <button class="btn primary" onclick="quickToday()">Appello di oggi</button>
  <button class="btn ghost" style="margin-top:9px;margin-bottom:14px" onclick="editSession()">
    Programma un allenamento</button>

  ${next.length ? `<h3 class="muted" style="margin:0 0 8px">In programma</h3>${next.map(card).join("")}` : ""}
  ${past.length ? `<h3 class="muted" style="margin:18px 0 8px">Svolti</h3>${past.slice(0,20).map(card).join("")}` : ""}
  ${!ss.length ? `<div class="card"><div class="empty"><b>Nessun allenamento</b>
     Programmane uno, oppure usa il tasto in alto per fare l'appello di oggi.</div></div>` : ""}`;
}

    db.sessions.push(s); db.att[s.id] = {}; save();

function saveSession(id){
  const g = i => document.getElementById(i).value;
  const data = {date:g("sd"), time:g("st"), pitch:g("sp").trim() || "Campo A", notes:g("sn").trim()};
  const clash = db.sessions.find(x => x.teamId === db.current && x.date === data.date && x.id !== id);
  if(clash) return toast("C'è già un allenamento in quella data");
  if(id) Object.assign(sessById(id), data);
  else {
    const s = {id:uid(), teamId:db.current, closed:false, ...data};
    db.sessions.push(s); db.att[s.id] = {};
  }
  save(); closeSheet(); render();
}
function delSession(id){
  const c = sessCounts(sessById(id));
  if(c.done && !confirm("L'appello di questo allenamento è già stato fatto. Eliminarlo comunque?")) return;
  if(!c.done && !confirm("Eliminare l'allenamento?")) return;
  db.sessions = db.sessions.filter(s => s.id !== id);
  delete db.att[id];
  if(curSess === id){ curSess = null; tab = "appello"; }
  save(); closeSheet(); render();
}

function toggleCallup(mid, pid, el){

function shareMatch(id){
  const m = db.matches.find(x=>x.id===id);
  const names = (m.callups||[]).map(pid => db.players.find(p=>p.id===pid))
    .filter(Boolean).sort((a,b)=>a.last.localeCompare(b.last,"it"))

/* ============ REPORT ============ */
let repMonth = today().slice(0,7);

const inMonth = (iso, mk) => (iso || "").startsWith(mk);
const monthLabel = mk => new Date(mk + "-15T12:00")
  .toLocaleDateString("it-IT", {month:"long", year:"numeric"});

/* Tutto quello che un ragazzo ha fatto nel mese: allenamenti, partite,
   gol e assist con la frazione in cui sono arrivati. */
function monthStats(pid, mk){
  const ss = db.sessions.filter(s => s.teamId === db.current && inMonth(s.date, mk));
  const c = {P:0, A:0, G:0, I:0};
  ss.forEach(s => { const st = db.att[s.id]?.[pid]?.s; if(st) c[st]++; });
  const registrati = c.P + c.A + c.G + c.I;

  const ms = db.matches.filter(m => m.teamId === db.current && inMonth(m.date, mk));
  let minuti = 0, partite = 0;
  const gol = {}, ass = {};
  ms.forEach(m => {
    normMatch(m);
    const t = minutesOf(m, pid);
    if(t > 0){ partite++; minuti += t; }
    SEGS.forEach(x => {
      const g = evIn(m, pid, "g", x.k), a = evIn(m, pid, "a", x.k);
      if(g) gol[x.k] = (gol[x.k] || 0) + g;
      if(a) ass[x.k] = (ass[x.k] || 0) + a;
    });
  });
  const somma = o => Object.values(o).reduce((x,y)=>x+y, 0);
  return {
    ...c, registrati, allenamenti: ss.length,
    freq: registrati ? Math.round(c.P / registrati * 100) : null,
    partite, minuti, gol, ass, golTot: somma(gol), assTot: somma(ass),
  };
}
const detSeg = o => SEGS.filter(x => o[x.k]).map(x => `${o[x.k]} al ${x.sh}`).join(", ");

/* --- esportazione del mese --- */
function exportMonth(el){
  return busy(el, () => {
    const r = roster(), mk = repMonth;
    const ss = db.sessions.filter(s => s.teamId === db.current && inMonth(s.date, mk))
                          .sort((a,b)=>a.date.localeCompare(b.date));
    const ms = db.matches.filter(m => m.teamId === db.current && inMonth(m.date, mk))
                         .sort((a,b)=>a.date.localeCompare(b.date));
    ms.forEach(normMatch);

    const rie = {
      name: "Riepilogo",
      title: `${db.club} — ${team().name}`,
      meta: [["Report mensile", monthLabel(mk)],
             ["Allenamenti nel mese", ss.length],
             ["Partite nel mese", ms.length]],
      head: ["Cognome","Nome","Numero","Allenamenti","Presenze","Assenze","Giustificate",
             "Infortuni","Frequenza %","Partite","Minuti","Gol","Dettaglio gol","Assist","Dettaglio assist"],
      body: r.map(p => {
        const st = monthStats(p.id, mk);
        return [p.last, p.first, p.num ? Number(p.num) : "", st.registrati, st.P, st.A, st.G, st.I,
                st.freq ?? "", st.partite, st.minuti, st.golTot, detSeg(st.gol), st.assTot, detSeg(st.ass)];
      }),
    };
    const col = n => rie.body.reduce((x, row) => x + (typeof row[n] === "number" ? row[n] : 0), 0);
    rie.total = ["Totali","","", col(3), col(4), col(5), col(6), col(7), "", col(9), col(10), col(11), "", col(13), ""];

    const pres = {
      name: "Presenze",
      title: `Allenamenti di ${monthLabel(mk)}`,
      head: ["Cognome","Nome", ...ss.map(x => dShort(x.date)), "Presenze"],
      body: r.map(p => {
        let ok = 0;
        const cells = ss.map(x => {
          const st = db.att[x.id]?.[p.id]?.s;
          if(st === "P") ok++;
          return st ? LAB[st] : "";
        });
        return [p.last, p.first, ...cells, ok];
      }),
    };

    const eventi = {
      name: "Gol e assist",
      head: ["Data","Avversario","Segmento","Tempo","Tipo","Cognome","Nome"],
      body: ms.flatMap(m => m.events.map(e => {
        const p = db.players.find(x => x.id === e.pid), si = segInfo(e.seg);
        return p && si ? [new Date(m.date+"T12:00").toLocaleDateString("it-IT"),
          m.opponent, si.sh, si.per, e.t === "g" ? "Gol" : "Assist", p.last, p.first] : null;
      }).filter(Boolean)),
    };

    const gare = {
      name: "Gare",
      head: ["Data","Avversario","Tempi vinti","V-P-S","Gol fatti","Gol subiti","Punti"],
      body: ms.map(m => { const sc = scoreOf(m);
        return [new Date(m.date+"T12:00").toLocaleDateString("it-IT"), m.opponent,
          `${sc.w}-${sc.l}`, `${sc.w}-${sc.d}-${sc.l}`, sc.gf, sc.ga, sc.punti]; }),
    };
    if(ms.length) gare.total = ["Totali","","","",
      ms.reduce((n,m)=>n+scoreOf(m).gf,0), ms.reduce((n,m)=>n+scoreOf(m).ga,0),
      ms.reduce((n,m)=>n+scoreOf(m).punti,0)];

    saveXlsx(`report-${mk}-${slug(team().name)}.xlsx`, [rie, pres, eventi, gare]);
    toast("Report del mese scaricato");
  });
}

/* ============ MATCHDAY ============ */
/* Il regolamento conta TRE tempi, ma il terzo si gioca in due frazioni
   separate dall'intervallo tecnico. I minuti si misurano sui quattro
   segmenti, i punti sui tre tempi: tenerli distinti evita di assegnare
   punti anche al 3A e al 3B. */

const SEGS = [
  {k:"T1",  lab:"1° tempo",           sh:"1°",  def:15, per:"T1"},
  {k:"T2",  lab:"2° tempo",           sh:"2°",  def:15, per:"T2"},
  {k:"T3A", lab:"3° tempo — parte A", sh:"3°A", def:10, per:"T3"},
  {k:"T3B", lab:"3° tempo — parte B", sh:"3°B", def:10, per:"T3", brk:true},
];
const SEGKEYS = SEGS.map(s => s.k);
const PERS = [{k:"T1",lab:"1° tempo"},{k:"T2",lab:"2° tempo"},{k:"T3",lab:"3° tempo"}];
const segsOf = per => SEGS.filter(s => s.per === per).map(s => s.k);
const segInfo = k => SEGS.find(s => s.k === k);

const FORMS = {
  "7v7":["1-2-3-1","1-3-2-1","1-2-2-2","1-3-1-2"],
  "8v8":["1-3-3-1","1-3-2-2","1-2-3-2","1-4-2-1"],
  "9v9":["1-3-3-2","1-4-3-1","1-3-4-1","1-4-2-2"]
};
let curMatch = null, seg = "T1", picked = null;

function slotsOf(name){
  const lines = name.split("-").slice(1).map(Number);
  const out = [{id:"gk", lab:"P", x:50, y:91}];
  lines.forEach((c, li) => {
    const r = li===0 ? "d" : li===lines.length-1 ? "a" : "c";
    const lab = r==="d" ? "D" : r==="c" ? "C" : "A";
    const y = 74 - li*(56/Math.max(lines.length-1,1));
    for(let i=0;i<c;i++) out.push({id:`${r}${li}${i}`, lab, x:100*(i+1)/(c+1), y});
  });
  return out;
}

function normMatch(m){
  if(!m.format) m.format = "7v7";
  if(!m.formation || !FORMS[m.format].includes(m.formation)) m.formation = FORMS[m.format][0];

  /* migrazione dal vecchio modello a 3 tempi */
  if(m.lineups && m.lineups["1"] && !m.lineups.T1){
    m.lineups = {T1:m.lineups["1"]||{}, T2:m.lineups["2"]||{}, T3A:m.lineups["3"]||{}, T3B:{}};
  }
  if(!m.lineups) m.lineups = {};
  SEGKEYS.forEach(k => { if(!m.lineups[k]) m.lineups[k] = {}; });

  if(!m.segMin){
    m.segMin = {};
    SEGS.forEach((s,i) => m.segMin[s.k] = (m.periods && m.periods[i]) || s.def);
    if(m.periods){ m.segMin.T3A = Math.round((m.periods[2]||20)/2); m.segMin.T3B = m.segMin.T3A; }
  }
  SEGS.forEach(s => { if(!m.segMin[s.k]) m.segMin[s.k] = s.def; });

  if(!m.opp) m.opp = {};
  SEGKEYS.forEach(k => { if(typeof m.opp[k] !== "number") m.opp[k] = 0; });

  if(!m.subs) m.subs = [];
  if(!m.events) m.events = [];
  m.events.forEach(e => { if(!e.seg) e.seg = e.p === 2 ? "T2" : e.p === 3 ? "T3A" : "T1"; });
  if(!m.callups) m.callups = [];
  return m;
}
const theMatch = () => normMatch(db.matches.find(m => m.id === curMatch));
function openMatch(id){ curMatch = id; seg = "T1"; picked = null; tab = "match"; render(); window.scrollTo(0,0); }

/* --- formazione in campo, cambi applicati --- */
function currentLineup(m, k){
  const line = Object.assign({}, m.lineups[k]);
  m.subs.filter(s => s.seg === k).sort((a,b)=>a.min-b.min).forEach(s => {
    const slot = Object.keys(line).find(x => line[x] === s.out);
    if(slot) line[slot] = s.in;
  });
  return line;
}

/* --- minuti effettivi, cambi in corsa compresi --- */
function minutesIn(m, k, pid){
  const dur = +m.segMin[k] || 0;
  const started = Object.values(m.lineups[k]).includes(pid);
  const subs = m.subs.filter(s => s.seg === k && (s.in === pid || s.out === pid))
                     .sort((a,b)=>a.min-b.min);
  if(!started && !subs.length) return 0;
  let tot = 0, since = started ? 0 : null;
  subs.forEach(s => {
    const mm = Math.max(0, Math.min(dur, +s.min || 0));
    if(s.in === pid && since === null) since = mm;
    else if(s.out === pid && since !== null){ tot += mm - since; since = null; }
  });
  if(since !== null) tot += dur - since;
  return Math.max(0, tot);
}
const minutesOf = (m,pid) => SEGKEYS.reduce((n,k) => n + minutesIn(m,k,pid), 0);
const segsPlayed = (m,pid) => SEGKEYS.filter(k => minutesIn(m,k,pid) > 0).length;
const evCount = (m,pid,t) => m.events.filter(e => e.pid===pid && e.t===t).length;
const evIn = (m,pid,t,k) => m.events.filter(e => e.pid===pid && e.t===t && e.seg===k).length;
const golIn = (m,k) => m.events.filter(e => e.t==="g" && e.seg===k).length;

/* --- punteggio federale: ogni tempo vale a sé --- */
function scoreOf(m){
  const periods = PERS.map(pe => {
    const ks = segsOf(pe.k);
    const gf = ks.reduce((n,k)=>n+golIn(m,k),0);
    const ga = ks.reduce((n,k)=>n+(+m.opp[k]||0),0);
    return {...pe, gf, ga, diff:gf-ga, res: gf>ga ? "V" : gf<ga ? "S" : "P"};
  });
  const w = periods.filter(p=>p.res==="V").length;
  const l = periods.filter(p=>p.res==="S").length;
  const d = periods.filter(p=>p.res==="P").length;
  const gf = periods.reduce((n,p)=>n+p.gf,0), ga = periods.reduce((n,p)=>n+p.ga,0);
  return {periods, w, l, d, gf, ga, diff:gf-ga, punti:w,
          esito: w>l ? "V" : w<l ? "S" : "P"};
}

/* --- azioni --- */
function setSeg(k){ seg = k; picked = null; render(); }
function setFormat(f){
  const m = theMatch();
  m.format = f; m.formation = FORMS[f][0];
  SEGKEYS.forEach(k => m.lineups[k] = {});
  m.subs = [];
  save(); render();
}
function setFormation(f){
  const m = theMatch();
  m.formation = f;
  SEGKEYS.forEach(k => m.lineups[k] = {});
  m.subs = [];
  save(); render();
}
function setSegMin(k, v){
  theMatch().segMin[k] = Math.max(1, Math.min(45, +v || 1));
  save(); render();
}
function oppGoal(d){
  const m = theMatch();
  m.opp[seg] = Math.max(0, (+m.opp[seg] || 0) + d);
  save(); render();
}
function tapSlot(sid){
  const m = theMatch(), line = m.lineups[seg];
  if(m.subs.some(x => x.seg === seg))
    return toast("In questo segmento ci sono cambi: usa «Registra un cambio»");
  if(picked){
    Object.keys(line).forEach(k => { if(line[k] === picked) line[k] = null; });
    line[sid] = picked; picked = null;
    save(); if(navigator.vibrate) navigator.vibrate(8); return render();
  }
  if(line[sid]){ line[sid] = null; save(); return render(); }
  const free = roster().filter(p => m.callups.includes(p.id) && !Object.values(line).includes(p.id));
  if(!free.length) return toast("Tutti i convocati sono già in campo");
  sheet(`<h3>Chi va in questa posizione?</h3>
    <p class="muted">Ordinati per minuti giocati: in cima chi ne ha di meno.</p>
    <div class="chiplist">${free.sort((a,b)=>minutesOf(m,a.id)-minutesOf(m,b.id))
      .map(p=>`<button class="chip" onclick="assignSlot('${sid}','${p.id}')">
        ${p.num ?? "–"} ${E(p.last)} · ${minutesOf(m,p.id)}′</button>`).join("")}</div>`);
}
function assignSlot(sid, pid){
  const line = theMatch().lineups[seg];
  Object.keys(line).forEach(k => { if(line[k] === pid) line[k] = null; });
  line[sid] = pid;
  save(); closeSheet(); render();
}
function copyPrev(){
  const m = theMatch();
  const i = SEGKEYS.indexOf(seg);
  if(i < 1) return;
  m.lineups[seg] = Object.assign({}, currentLineup(m, SEGKEYS[i-1]));
  m.subs = m.subs.filter(x => x.seg !== seg);
  save(); render();
}
function clearSeg(){
  const m = theMatch();
  m.lineups[seg] = {};
  m.subs = m.subs.filter(x => x.seg !== seg);
  save(); render();
}
/* Schiera automaticamente chi ha giocato meno: è quello che chiede il
   regolamento dopo l'intervallo tecnico. */
function rotate(){
  const m = theMatch(), slots = slotsOf(m.formation);
  const ordered = roster().filter(p => m.callups.includes(p.id))
    .sort((a,b) => minutesOf(m,a.id) - minutesOf(m,b.id));
  const line = {};
  slots.forEach((s,i) => { if(ordered[i]) line[s.id] = ordered[i].id; });
  m.lineups[seg] = line;
  m.subs = m.subs.filter(x => x.seg !== seg);
  save(); render();
  toast("Schierati gli " + slots.length + " con meno minuti");
}
function newSub(){
  const m = theMatch(), line = currentLineup(m, seg);
  const onField = Object.values(line).filter(Boolean)
    .map(id => db.players.find(p=>p.id===id)).filter(Boolean);
  const bench = roster().filter(p => m.callups.includes(p.id) && !Object.values(line).includes(p.id));
  if(!onField.length) return toast("Schiera prima la formazione del segmento");
  if(!bench.length) return toast("Nessuno in panchina");
  sheet(`<h3>Cambio nel ${segInfo(seg).lab}</h3>
    <label for="sbo">Esce</label>
    <select id="sbo">${onField.map(p=>`<option value="${p.id}">${p.num ?? "–"} ${E(p.last)} ${E(p.first)}</option>`).join("")}</select>
    <label for="sbi">Entra</label>
    <select id="sbi">${bench.sort((a,b)=>minutesOf(m,a.id)-minutesOf(m,b.id))
      .map(p=>`<option value="${p.id}">${p.num ?? "–"} ${E(p.last)} ${E(p.first)} · ${minutesOf(m,p.id)}′</option>`).join("")}</select>
    <label for="sbm">Minuto del segmento (0 – ${m.segMin[seg]})</label>
    <input id="sbm" type="number" min="0" max="${m.segMin[seg]}" value="${Math.round(m.segMin[seg]/2)}">
    <button class="btn primary" style="margin-top:14px" onclick="saveSub()">Registra il cambio</button>`);
}
function saveSub(){
  const m = theMatch();
  const out = document.getElementById("sbo").value, inn = document.getElementById("sbi").value;
  const min = Math.max(0, Math.min(+m.segMin[seg], +document.getElementById("sbm").value || 0));
  if(out === inn) return toast("Sono lo stesso giocatore");
  m.subs.push({id:uid(), seg, min, in:inn, out});
  save(); closeSheet(); render();
}
function delSub(id){
  const m = theMatch();
  m.subs = m.subs.filter(x => x.id !== id);
  save(); render();
}
function addEv(pid, t){
  theMatch().events.push({id:uid(), pid, t, seg});
  save(); if(navigator.vibrate) navigator.vibrate(12); render();
}
function delEv(pid, t){
  const m = theMatch();
  for(let i=m.events.length-1;i>=0;i--){
    if(m.events[i].pid===pid && m.events[i].t===t && m.events[i].seg===seg){ m.events.splice(i,1); break; }
  }
  save(); render();
}
function shareTabellino(){
  const m = theMatch(), squad = roster().filter(p=>m.callups.includes(p.id)), sc = scoreOf(m);
  let t = `⚽ ${db.club} — ${m.opponent}\n${dLong(m.date)} · ${m.format}\n\n`;
  t += `Risultato a tempi: ${sc.w}-${sc.l}  (${sc.w}V ${sc.d}P ${sc.l}S)\n`;
  t += `Gol complessivi: ${sc.gf}-${sc.ga}\n`;
  sc.periods.forEach(pe => t += `  ${pe.lab}: ${pe.gf}-${pe.ga}\n`);
  const det = (p,ty) => SEGS.filter(s=>evIn(m,p.id,ty,s.k)).map(s=>`${evIn(m,p.id,ty,s.k)} al ${s.sh}`).join(", ");
  const sc2 = squad.filter(p=>evCount(m,p.id,"g")>0)
    .map(p=>`• ${p.last} ${p.first}: ${evCount(m,p.id,"g")} (${det(p,"g")})`).join("\n");
  const as = squad.filter(p=>evCount(m,p.id,"a")>0)
    .map(p=>`• ${p.last} ${p.first}: ${evCount(m,p.id,"a")} (${det(p,"a")})`).join("\n");
  if(sc2) t += `\nMarcatori:\n${sc2}\n`;
  if(as) t += `\nAssist:\n${as}\n`;
  t += `\nMinuti giocati:\n`;
  t += [...squad].sort((a,b)=>minutesOf(m,b.id)-minutesOf(m,a.id))
        .map(p=>`• ${p.last} ${p.first}: ${minutesOf(m,p.id)}′`).join("\n");
  t += `\n\nBravi ragazzi! 💪`;
  shareText(t, "Tabellino");
}

/* ============ CONVOCAZIONE STAMPABILE ============ */
const NOTE_DEF = "Portare sempre parastinchi e borraccia personale.\n" +
  "Fate una buona colazione, almeno 1 ora e 30 / 2 ore prima della gara.\n" +
  "Fare sapere con anticipo eventuali assenze.";

/* Ogni riga delle note ha i suoi colori: il mister decide cosa deve
   saltare all'occhio nel gruppo WhatsApp. */
const PALETTE = [
  {n:"Avviso",   bg:"#FEF08A", fg:"#854D0E"},
  {n:"Info",     bg:"#DBEAFE", fg:"#1E3A8A"},
  {n:"Conferma", bg:"#DCFCE7", fg:"#14532D"},
  {n:"Urgente",  bg:"#FEE2E2", fg:"#991B1B"},
  {n:"Neutro",   bg:"#F1F5F9", fg:"#334155"},
  {n:"Scuro",    bg:"#16233A", fg:"#FFFFFF"},
];
function normNotes(){
  if(Array.isArray(db.notes) && db.notes.length) return db.notes;
  const src = (db.noteConv || NOTE_DEF).split("\n").map(x => x.trim()).filter(Boolean);
  db.notes = src.map(t => ({id:uid(), text:t, bg:"#FEF08A", fg:"#854D0E", bold:true, warn:false}));
  return db.notes;
}

function openConv(){ tab = "conv"; render(); window.scrollTo(0,0); }

/* Presenze degli ultimi 7 giorni prima della gara: il dato su cui il
   mister decide chi convocare. */
function weekStats(pid, beforeDate){
  const to = new Date(beforeDate + "T12:00"), from = new Date(to - 7*86400000);
  const ss = db.sessions.filter(s => s.teamId === db.current &&
    new Date(s.date+"T12:00") > from && new Date(s.date+"T12:00") <= to);
  let tot = 0, pres = 0;
  ss.forEach(s => { const st = db.att[s.id]?.[pid]?.s; if(st){ tot++; if(st === "P") pres++; } });
  return {tot, pres, last: ss.length ? db.att[ss[ss.length-1].id]?.[pid]?.s : null};
}

function viewConv(){
  const m = theMatch();
  if(!m){ tab = "gare"; return viewGare(); }
  const r = roster();

  const rows = r.map(p => {
    const w = weekStats(p.id, m.date);
    const pct = w.tot ? Math.round(w.pres/w.tot*100) : null;
    const cls = pct === null ? "mid" : pct >= 75 ? "hi" : pct >= 50 ? "mid" : "lo";
    const cs = certState(p);
    const warn = cs === "expired" ? `<span class="flag exp">Certificato scaduto</span>`
               : cs === "missing" ? `<span class="flag exp">Certificato mancante</span>` : "";
    return `<div class="convrow" aria-pressed="${m.callups.includes(p.id)}"
        onclick="toggleConv('${p.id}', this)">
      <span class="tick">✓</span>
      <span class="jersey">${p.num ?? "–"}</span>
      <span class="nm"><b>${E(p.last)} ${E(p.first)}</b>
        <span>${w.tot ? `${w.pres}/${w.tot} allenamenti questa settimana` : "nessun allenamento registrato"}</span>
        ${warn}</span>
      <span class="freq ${cls}">${pct === null ? "–" : pct + "%"}</span>
    </div>`;
  }).join("");

  return `
  <button class="backlink" onclick="go('match')">← Torna alla partita</button>

  <div class="card">
    <h2>Convocazione</h2>
    <p class="muted">${E(db.club)} — ${E(m.opponent)} · ${dLong(m.date)}</p>
    <p class="muted" style="margin-top:8px">Accanto a ogni nome trovi le presenze
      agli allenamenti della settimana prima della gara. Tocca i nomi per convocarli.</p>
    <div class="row2" style="margin-top:12px">
      <button class="btn ghost sm" style="width:auto" onclick="convAll(true)">Seleziona tutti</button>
      <button class="btn ghost sm" style="width:auto" onclick="convAll(false)">Deseleziona</button>
    </div>
  </div>

  <div class="card"><div>${rows}</div></div>

  <div class="card">
    <h2>Dati del foglio</h2>
    <div class="row2">
      <div><label for="ci">Istruttore</label><input id="ci" value="${E(db.coach||"")}" placeholder="Cognome"></div>
      <div><label for="cp">Cellulare</label><input id="cp" value="${E(db.phone||"")}" inputmode="tel"></div>
    </div>
    <label>Indicazioni per le famiglie</label>
    <p class="muted" style="margin:0 0 9px">Ogni riga ha i suoi colori: tocca un pallino
      per cambiare sfondo e testo, <b>B</b> per il grassetto, il triangolo per il segnale
      di avviso.</p>
    ${noteEditor()}
    <button class="btn ghost sm" style="width:100%;margin-top:4px" onclick="addNote()">
      Aggiungi una riga</button>
    <label for="ck">Abbigliamento</label>
    <input id="ck" value="${E(m.kit||"")}" placeholder="Maglietta azzurra, tuta di rappresentanza">
    <button class="btn primary" style="margin-top:14px" onclick="makeConv()">
      Genera la convocazione (${m.callups.length})</button>
  </div>

  <div id="convout"></div>`;
}

function toggleConv(pid, el){
  const m = theMatch();
  const i = m.callups.indexOf(pid);
  if(i < 0) m.callups.push(pid); else m.callups.splice(i, 1);
  el.setAttribute("aria-pressed", i < 0);
  save();
  const b = document.querySelector('#view .btn.primary');
  if(b) b.textContent = `Genera la convocazione (${m.callups.length})`;
}
function convAll(on){
  const m = theMatch();
  m.callups = on ? roster().map(p => p.id) : [];
  save(); render();
}

/* --- Disegno su canvas: nessuna libreria, funziona offline --- */
function noteEditor(){
  const rows = normNotes();
  if(!rows.length) return `<p class="muted">Nessuna indicazione. Aggiungine una qui sotto.</p>`;
  return rows.map(r => `
    <div class="noterow" style="background:${r.bg};border-left-color:${r.fg}">
      <textarea rows="2" style="color:${r.fg};font-weight:${r.bold?700:400}"
        onchange="setNote('${r.id}','text',this.value)">${E(r.text)}</textarea>
      <div class="notetools">
        ${PALETTE.map(c => `<button class="sw" title="${c.n}" style="background:${c.bg}"
          aria-pressed="${r.bg===c.bg}" onclick="paintNote('${r.id}','${c.bg}','${c.fg}')"></button>`).join("")}
        <button class="tg" aria-pressed="${!!r.bold}" onclick="toggleNote('${r.id}','bold')">B</button>
        <button class="tg" aria-pressed="${!!r.warn}" onclick="toggleNote('${r.id}','warn')">⚠</button>
        <button class="tg del" onclick="delNote('${r.id}')">Elimina</button>
      </div>
    </div>`).join("");
}
function setNote(id, k, v){
  const r = normNotes().find(x => x.id === id);
  if(r){ r[k] = v; save(); }
}
function paintNote(id, bg, fg){
  const r = normNotes().find(x => x.id === id);
  if(r){ r.bg = bg; r.fg = fg; save(); render(); }
}
function toggleNote(id, k){
  const r = normNotes().find(x => x.id === id);
  if(r){ r[k] = !r[k]; save(); render(); }
}
function addNote(){
  normNotes().push({id:uid(), text:"", bg:"#DBEAFE", fg:"#1E3A8A", bold:false, warn:false});
  save(); render();
}
function delNote(id){
  db.notes = normNotes().filter(x => x.id !== id);
  save(); render();
}

async function makeConv(){
  const m = theMatch();
  db.coach = document.getElementById("ci").value.trim();
  db.phone = document.getElementById("cp").value.trim();
  m.kit = document.getElementById("ck").value.trim();
  save();

  if(!m.callups.length) return toast("Seleziona almeno un convocato");

  const names = roster().filter(p => m.callups.includes(p.id))
    .sort((a,b) => a.last.localeCompare(b.last, "it"))
    .map(p => (p.last + " " + (p.first || "")).trim());

  const canvas = await drawConv(m, names);
  const out = document.getElementById("convout");
  out.innerHTML = `<div class="card"><h2>Pronta da inviare</h2>
    <img class="preview" src="${canvas.toDataURL("image/png")}" alt="Convocazione">
    <button class="btn wa" style="margin-top:12px" onclick="shareConv()">Condividi su WhatsApp</button>
    <button class="btn ghost" style="margin-top:9px" onclick="dlConv()">Salva l'immagine</button>
    <p class="muted" style="margin-top:9px">Su iPhone e Android il tasto verde apre la scelta
      del gruppo con l'immagine già allegata.</p></div>`;
  window._conv = canvas;
  out.scrollIntoView({behavior:"smooth", block:"start"});
}

/* I loghi possono stare in `icons/` nella repo: l'app li cerca lì da
   sola, provando le estensioni più comuni. Un file caricato a mano
   dalle impostazioni ha comunque la precedenza. */
const LOGO_EXT = ["png", "jpg", "jpeg", "webp", "svg"];
async function resolveLogo(uploaded, base){
  if(uploaded) return loadImg(uploaded);
  for(const ext of LOGO_EXT){
    const im = await loadImg(`icons/${base}.${ext}`);
    if(im) return im;
  }
  return null;
}

function loadImg(src){
  return new Promise(res => {
    if(!src) return res(null);
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = src;
  });
}

async function drawConv(m, names){
  const W = 1000, H = 1414;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);

  const M = 55, w = W - M*2;
  let y = M;
  const F = (sz, b) => `${b ? "bold " : ""}${sz}px Arial, Helvetica, sans-serif`;

  const box = (x0, y0, ww, hh, fill) => {
    if(fill){ g.fillStyle = fill; g.fillRect(x0, y0, ww, hh); }
    g.strokeStyle = "#000"; g.lineWidth = 2; g.strokeRect(x0, y0, ww, hh);
  };

  /* Rimpicciolisce il testo finché non entra nella cella: sul foglio
     ufficiale non deve uscire una lettera dai bordi. */
  const fit = (t, maxW, sz, bold) => {
    let s = sz;
    g.font = F(s, bold);
    while(g.measureText(t).width > maxW && s > 11){ s -= 1; g.font = F(s, bold); }
    return s;
  };
  const cText = (t, yy, sz, col, bold = true) => {
    fit(t, w - 28, sz, bold);
    g.fillStyle = col; g.textAlign = "center";
    g.fillText(t, W/2, yy);
  };
  const lText = (lbl, val, yy, sz) => {
    g.textAlign = "left";
    let s = sz;
    g.font = F(s, true);
    while(g.measureText(lbl + " " + val).width > w - 28 && s > 11){ s -= 1; g.font = F(s, true); }
    g.fillStyle = "#C00000"; g.fillText(lbl, M + 14, yy);
    const off = g.measureText(lbl).width;
    g.fillStyle = "#000"; g.fillText(val, M + 14 + off + 9, yy);
  };

  /* intestazione: tre riquadri per i loghi, come sul modello ufficiale */
  const [imgL, imgC, imgR] = await Promise.all([
    resolveLogo(db.logo,  "logo_miracoli"),
    resolveLogo(db.logoC, "logo_italia"),
    resolveLogo(db.logoR, "logo_adidas"),
  ]);
  const hb = 168;
  box(M, y, w, hb);
  const third = w/3;
  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = "high";
  [imgL, imgC, imgR].forEach((im, k) => {
    if(!im) return;
    const pad = 12, maxH = hb - pad*2, maxW = third - pad*2;
    const r = Math.min(maxW / im.width, maxH / im.height);
    const iw = im.width * r, ih = im.height * r;
    g.drawImage(im, M + third*k + (third - iw)/2, y + (hb - ih)/2, iw, ih);
  });
  if(!imgL && !imgC && !imgR){
    g.textAlign = "center";
    fit(db.club.toUpperCase(), w - 40, 34, true);
    g.fillStyle = "#7B1123"; g.fillText(db.club.toUpperCase(), W/2, y + 62);
    g.font = F(18, false); g.fillStyle = "#555";
    g.fillText((db.site || "").toUpperCase(), W/2, y + 92);
  }
  y += hb;

  /* blocco informazioni */
  box(M, y, w, 46); cText("CATEGORIA", y + 32, 26, "#0070C0"); y += 46;
  box(M, y, w, 46); cText((team().name || "").toUpperCase(), y + 32, 25, "#000"); y += 46;
  box(M, y, w, 46); cText("INCONTRO", y + 32, 26, "#0070C0"); y += 46;
  const sfida = m.venue === "home"
    ? `${db.club} - ${m.opponent}` : `${m.opponent} - ${db.club}`;
  box(M, y, w, 46); cText(sfida.toUpperCase(), y + 32, 25, "#000"); y += 46;

  const dat = new Date(m.date + "T12:00").toLocaleDateString("it-IT");
  [
    ["DATA:", dat, null],
    ["APPUNTAMENTO ALLE ORE:", m.meet, "#FFFF00"],
    ["INDIRIZZO CAMPO:", (m.place + (m.address ? " — " + m.address : "")).toUpperCase(), null],
    ["INIZIO GARA ALLE ORE:", m.kick, null],
    ["ISTRUTTORE:", (db.coach || "").toUpperCase(), null],
    ["CELLULARE:", db.phone || "", null],
  ].forEach(([l, v, bg]) => { box(M, y, w, 42, bg); lText(l, v, y + 29, 22); y += 42; });

  /* elenco convocati: due colonne da 11, cognome e nome per esteso */
  y += 26;
  const half = w/2, numW = 52, rowH = 42, per = 11;
  for(let i = 0; i < per; i++){
    [0, 1].forEach(col => {
      const x0 = M + col*half;
      const n = i + 1 + col*per;
      box(x0, y, numW, rowH);
      g.textAlign = "center"; g.font = F(21, true); g.fillStyle = "#000";
      g.fillText(String(n), x0 + numW/2, y + 29);
      box(x0 + numW, y, half - numW, rowH);
      const nm = names[n - 1];
      if(nm){
        const cellW = half - numW - 22;
        fit(nm, cellW, 21, true);
        g.textAlign = "left"; g.fillStyle = "#000";
        g.fillText(nm, x0 + numW + 12, y + 29);
      }
    });
    y += rowH;
  }

  /* indicazioni per le famiglie: ogni riga è una scheda con i suoi
     colori, testo grande e a capo automatico */
  y += 24;
  const items = normNotes().filter(r => r.text.trim()).map(r => ({...r}));
  if(m.kit) items.push({text:"Presentarsi con: " + m.kit, bg:"#F1F5F9", fg:"#334155", bold:false, warn:false});

  const SZ = 24, LH = 33, PADX = 18, PADY = 15;
  items.forEach(r => {
    const indent = r.warn ? 46 : 0;
    g.font = F(SZ, r.bold);
    const maxW = w - PADX*2 - indent, lines = [];
    let cur = "";
    r.text.trim().split(/\s+/).forEach(word => {
      const test = cur ? cur + " " + word : word;
      if(g.measureText(test).width > maxW && cur){ lines.push(cur); cur = word; }
      else cur = test;
    });
    if(cur) lines.push(cur);

    const bh = PADY*2 + lines.length*LH - (LH - SZ);
    g.fillStyle = r.bg;
    if(g.roundRect){ g.beginPath(); g.roundRect(M, y, w, bh, 10); g.fill(); }
    else g.fillRect(M, y, w, bh);
    g.strokeStyle = "rgba(15,23,42,.18)"; g.lineWidth = 1.5;
    if(g.roundRect){ g.beginPath(); g.roundRect(M, y, w, bh, 10); g.stroke(); }
    else g.strokeRect(M, y, w, bh);
    /* barra laterale del colore del testo: stacca la riga a colpo d'occhio */
    g.fillStyle = r.fg; g.fillRect(M, y + 4, 6, bh - 8);

    if(r.warn){
      const cx = M + PADX + 13, cy = y + PADY + 13;
      g.fillStyle = r.fg;
      g.beginPath();
      g.moveTo(cx, cy - 14); g.lineTo(cx + 15, cy + 12); g.lineTo(cx - 15, cy + 12);
      g.closePath(); g.fill();
      g.fillStyle = r.bg; g.font = F(16, true); g.textAlign = "center";
      g.fillText("!", cx, cy + 9);
    }

    g.fillStyle = r.fg; g.textAlign = "left"; g.font = F(SZ, r.bold);
    lines.forEach((l, i) => g.fillText(l, M + PADX + indent, y + PADY + SZ - 4 + i*LH));
    y += bh + 12;
  });

  return c;
}

function dlConv(){
  const a = document.createElement("a");
  a.href = window._conv.toDataURL("image/png");

  a.click();
}
function shareConv(){
  window._conv.toBlob(async blob => {
    const m = theMatch();
    const file = new File([blob], `convocazione-${m.date}.png`, {type:"image/png"});
    const testo = `Convocazione ${team().name} — ${db.club} vs ${m.opponent}, ${dLong(m.date)}. Ritrovo ${m.meet}.`;
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], text:testo}); return; }catch(e){ if(e.name === "AbortError") return; }
    }
    dlConv();
    toast("Immagine salvata: allegala tu al gruppo WhatsApp");
  }, "image/png");
}


/* ============ ESPORTAZIONE EXCEL (.xlsx) ============ */
/* Un .xlsx è uno ZIP di file XML. Scriverlo a mano costa una sessantina
   di righe e ci risparmia una libreria da 900 kB: l'app resta un file
   solo e continua a funzionare senza rete. */

/* --- ZIP, metodo "store": nessuna compressione, nessuna dipendenza --- */
const CRC_T = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < buf.length; i++) c = CRC_T[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;

  const u16 = n => [n & 255, (n >>> 8) & 255];
  const u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];

  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = typeof f.data === "string" ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const local = new Uint8Array([
      0x50,0x4b,0x03,0x04, ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
      ...u32(crc), ...u32(data.length), ...u32(data.length),
      ...u16(name.length), ...u16(0),
    ]);
    parts.push(local, name, data);
    central.push({name, crc, size: data.length, offset});
    offset += local.length + name.length + data.length;
  });

  const dir = [];
  central.forEach(c => {
    dir.push(new Uint8Array([
      0x50,0x4b,0x01,0x02, ...u16(20), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
      ...u32(c.crc), ...u32(c.size), ...u32(c.size),
      ...u16(c.name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0),
      ...u32(c.offset),
    ]), c.name);
  });
  const dirSize = dir.reduce((n, d) => n + d.length, 0);
  const end = new Uint8Array([
    0x50,0x4b,0x05,0x06, ...u16(0), ...u16(0),
    ...u16(central.length), ...u16(central.length),
    ...u32(dirSize), ...u32(offset), ...u16(0),
  ]);
  return new Blob([...parts, ...dir, end], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

const S = {TITLE:8, META:9, HEAD:1, L:2, C:3, ZL:4, ZC:5, TL:6, TC:7};
const XE = v => String(v ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function colLetter(n){
  let sxx = "";
  while(n >= 0){ sxx = String.fromCharCode(65 + (n % 26)) + sxx; n = Math.floor(n / 26) - 1; }
  return sxx;
}

/* Un foglio: titolo, coppie chiave/valore, intestazione, corpo, totali. */
function sheetXml(sh){
  const rows = [];
  let n = 0;
  const cell = (v, r, c, st) => {
    const ref = colLetter(c) + r;
    if(typeof v === "number" && isFinite(v))
      return `<c r="${ref}" s="${st}"><v>${v}</v></c>`;
    if(v === "" || v === null || v === undefined) return `<c r="${ref}" s="${st}"/>`;
    return `<c r="${ref}" s="${st}" t="inlineStr"><is><t xml:space="preserve">${XE(v)}</t></is></c>`;
  };

  if(sh.title){ n++; rows.push(`<row r="${n}" ht="26" customHeight="1">${cell(sh.title, n, 0, S.TITLE)}</row>`); n++; }
  (sh.meta || []).forEach(([k, v]) => {
    n++;
    rows.push(`<row r="${n}">${cell(k, n, 0, S.META)}${cell(v, n, 1, S.META)}</row>`);
  });
  if(sh.meta && sh.meta.length) n++;

  let headRow = 0, lastRow = 0;
  if(sh.head){
    n++; headRow = n;
    rows.push(`<row r="${n}" ht="30" customHeight="1">${
      sh.head.map((h, c) => cell(h, n, c, S.HEAD)).join("")}</row>`);
  }
  (sh.body || []).forEach((r, idx) => {
    n++; lastRow = n;
    const zebra = idx % 2 === 1;
    rows.push(`<row r="${n}">${r.map((v, c) => cell(v, n, c,
      typeof v === "number" || c > 2 ? (zebra ? S.ZC : S.C) : (zebra ? S.ZL : S.L))).join("")}</row>`);
  });
  if(sh.total){
    n++; lastRow = n;
    rows.push(`<row r="${n}">${sh.total.map((v, c) => cell(v, n, c,
      typeof v === "number" || c > 2 ? S.TC : S.TL)).join("")}</row>`);
  }

  /* larghezza colonne dal contenuto: mai una colonna di ### */
  const widths = [];
  [sh.head || [], ...(sh.body || []), sh.total || []].forEach(r =>
    (r || []).forEach((v, c) => {
      const len = String(v ?? "").length + 3;
      widths[c] = Math.max(widths[c] || 8, Math.min(42, len));
    }));
  const cols = widths.length
    ? `<cols>${widths.map((w, c) => `<col min="${c+1}" max="${c+1}" width="${w}" customWidth="1"/>`).join("")}</cols>`
    : "";

  const filter = (headRow && lastRow > headRow)
    ? `<autoFilter ref="A${headRow}:${colLetter((sh.head.length||1)-1)}${lastRow}"/>` : "";
  const freeze = headRow
    ? `<sheetViews><sheetView workbookViewId="0"><pane ySplit="${headRow}" topLeftCell="A${headRow+1}" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`
    : "";

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${freeze}${cols}
<sheetData>${rows.join("")}</sheetData>${filter}</worksheet>`;
}

function buildXlsx(sheets){
  const safe = t => String(t).replace(/[\\\/\?\*\[\]:]/g, " ").slice(0, 31);
  const files = [
    {name:"[Content_Types].xml", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}
</Types>`},
    {name:"_rels/.rels", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`},
    {name:"xl/workbook.xml", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
 xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${sheets.map((sh, i) => `<sheet name="${XE(safe(sh.name))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets>
</workbook>`},
    {name:"xl/_rels/workbook.xml.rels", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${sheets.map((_, i) => `<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}
<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`},
    {name:"xl/styles.xml", data:XLS_STYLES},
    ...sheets.map((sh, i) => ({name:`xl/worksheets/sheet${i+1}.xml`, data:sheetXml(sh)})),
  ];
  return zipStore(files);
}

function dlBlob(name, blob){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function dlFile(name, content, mime){ dlBlob(name, new Blob([content], {type:mime})); }
function saveXlsx(name, sheets){ dlBlob(name, buildXlsx(sheets)); }

/* Indicatore di attesa sul pulsante che ha lanciato l'export. */
async function busy(el, fn){
  if(!el) return fn();
  const old = el.innerHTML;
  el.disabled = true;
  el.innerHTML = `<span class="spin"></span> Preparo il file…`;
  try{ await new Promise(r => setTimeout(r, 30)); await fn(); }
  finally{ el.disabled = false; el.innerHTML = old; }
}

const slug = t => String(t).replace(/[^\w]+/g, "-").replace(/^-|-$/g, "");
const LAB = {P:"Presente", A:"Assente", G:"Giustificato", I:"Infortunato"};

/* --- un singolo allenamento --- */
function exportTraining(el){
  return busy(el, () => {
    const sess = sessById(curSess);
    if(!sess) return toast("Apri prima un allenamento");
    const a = db.att[sess.id] || {};
    const c = {P:0,A:0,G:0,I:0};
    const body = roster().map(p => {
      const st = a[p.id]?.s; if(st) c[st]++;
      return [p.last, p.first, p.num ? Number(p.num) : "", LAB[st] || "non registrato",
              a[p.id]?.n || "", p.cert || ""];
    });
    saveXlsx(`allenamento-${sess.date}-${slug(team().name)}.xlsx`, [{
      name: "Allenamento",
      title: `${db.club} — ${team().name}`,
      meta: [["Allenamento", dLong(sess.date)], ["Orario", sess.time || ""],
             ["Campo", sess.pitch || ""], ["Note", sess.notes || ""]],
      head: ["Cognome","Nome","Numero","Stato","Nota tecnica","Certificato"],
      body,
      total: ["Totali", "", body.length, `${c.P} P · ${c.A} A · ${c.G} G · ${c.I} I`, "", ""],
    }]);
    toast("File scaricato");
  });
}

/* --- una singola partita --- */
function exportMatch(el){
  return busy(el, () => {
    const m = theMatch();
    const squad = roster().filter(p => m.callups.includes(p.id));
    const sc = scoreOf(m);

    const tab = {
      name: "Tabellino",
      title: `${db.club} — ${m.opponent}`,
      meta: [
        ["Data", new Date(m.date+"T12:00").toLocaleDateString("it-IT")],
        ["Dove", m.venue === "home" ? "In casa" : "In trasferta"],
        ["Campo", m.place || ""],
        ["Formato", m.format], ["Modulo", m.formation],
        ["Risultato a tempi", `${sc.w}-${sc.l}`],
        ["Tempi V-P-S", `${sc.w}-${sc.d}-${sc.l}`],
        ["Punti", sc.punti],
        ["Gol complessivi", `${sc.gf}-${sc.ga}`],
        ["Differenza reti", sc.diff],
      ],
      head: ["Cognome","Nome","Numero", ...SEGS.map(x => x.sh + " (min)"),
             "Minuti","Gol","Assist","Subentrato"],
      body: squad.map(p => [p.last, p.first, p.num ? Number(p.num) : "",
        ...SEGKEYS.map(k => minutesIn(m,k,p.id)),
        minutesOf(m,p.id), evCount(m,p.id,"g"), evCount(m,p.id,"a"),
        SEGKEYS.some(k => minutesIn(m,k,p.id) > 0 && !Object.values(m.lineups[k]).includes(p.id)) ? "sì" : ""]),
    };
    tab.total = ["Totali", "", "", ...SEGKEYS.map(k => squad.reduce((n,p)=>n+minutesIn(m,k,p.id),0)),
      squad.reduce((n,p)=>n+minutesOf(m,p.id),0), sc.gf,
      squad.reduce((n,p)=>n+evCount(m,p.id,"a"),0), ""];

    const tempi = {
      name: "Tempi",
      title: "Punteggio federale",
      head: ["Tempo","Gol fatti","Gol subiti","Differenza","Esito","Punti"],
      body: sc.periods.map(pe => [pe.lab, pe.gf, pe.ga, pe.diff,
        pe.res === "V" ? "Vinto" : pe.res === "S" ? "Perso" : "Pari", pe.res === "V" ? 1 : 0]),
      total: ["Totale", sc.gf, sc.ga, sc.diff, `${sc.w}-${sc.d}-${sc.l}`, sc.punti],
    };

    const eventi = {
      name: "Eventi",
      head: ["Segmento","Tempo","Tipo","Cognome","Nome"],
      body: m.events.map(e => {
        const p = db.players.find(x => x.id === e.pid), si = segInfo(e.seg);
        return p && si ? [si.sh, si.per, e.t === "g" ? "Gol" : "Assist", p.last, p.first] : null;
      }).filter(Boolean),
    };

    const cambi = {
      name: "Cambi",
      head: ["Segmento","Minuto","Entra","Esce"],
      body: [...m.subs].sort((a,b)=>SEGKEYS.indexOf(a.seg)-SEGKEYS.indexOf(b.seg) || a.min-b.min)
        .map(x => {
          const pin = db.players.find(p=>p.id===x.in), pout = db.players.find(p=>p.id===x.out);
          return [segInfo(x.seg).sh, x.min, pin ? pin.last+" "+pin.first : "", pout ? pout.last+" "+pout.first : ""];
        }),
    };

    saveXlsx(`partita-${m.date}-${slug(m.opponent)}.xlsx`, [tab, tempi, eventi, cambi]);
    toast("File scaricato");
  });
}

/* --- archivio completo della stagione --- */
function exportAll(el){
  return busy(el, () => {
    const r = roster();
    const ss = db.sessions.filter(x => x.teamId === db.current).sort((a,b)=>a.date.localeCompare(b.date));
    const ms = db.matches.filter(x => x.teamId === db.current).sort((a,b)=>a.date.localeCompare(b.date));
    ms.forEach(normMatch);

    const gare = {
      name: "Calendario e partite",
      title: `${db.club} — ${team().name}`,
      meta: [["Stagione", `${ms.length} partite`], ["Aggiornato al", new Date().toLocaleDateString("it-IT")]],
      head: ["Data","Avversario","Dove","Formato","Convocati","Tempi vinti","V-P-S","Gol fatti","Gol subiti","Diff.","Punti"],
      body: ms.map(m => { const sc = scoreOf(m);
        return [new Date(m.date+"T12:00").toLocaleDateString("it-IT"), m.opponent,
          m.venue==="home"?"Casa":"Trasferta", m.format, m.callups.length,
          `${sc.w}-${sc.l}`, `${sc.w}-${sc.d}-${sc.l}`, sc.gf, sc.ga, sc.diff, sc.punti]; }),
    };
    gare.total = ["Totali","","","","", "", "",
      ms.reduce((n,m)=>n+scoreOf(m).gf,0), ms.reduce((n,m)=>n+scoreOf(m).ga,0),
      ms.reduce((n,m)=>n+scoreOf(m).diff,0), ms.reduce((n,m)=>n+scoreOf(m).punti,0)];

    const reg = {name:"Registro gare", title:"Tabellino per partita",
      head:["Data","Avversario","Cognome","Nome", ...SEGS.map(x=>x.sh), "Minuti","Gol","Assist"], body:[]};
    ms.forEach(m => {
      const d = new Date(m.date+"T12:00").toLocaleDateString("it-IT");
      r.filter(p => m.callups.includes(p.id)).forEach(p => reg.body.push([
        d, m.opponent, p.last, p.first, ...SEGKEYS.map(k => minutesIn(m,k,p.id)),
        minutesOf(m,p.id), evCount(m,p.id,"g"), evCount(m,p.id,"a")]));
    });

    const cum = {
      name: "Statistiche giocatori",
      title: "Cumulativo stagione",
      head: ["Cognome","Nome","Numero","Certificato","Allenamenti","Presenze","Frequenza %",
             "Partite","Minuti","Media min/gara","Gol","Assist"],
      body: r.map(p => {
        let tot = 0, ok = 0;
        ss.forEach(x => { const st = db.att[x.id]?.[p.id]?.s; if(st){ tot++; if(st === "P") ok++; } });
        let g = 0, a = 0, min = 0, gio = 0;
        ms.forEach(m => { const t = minutesOf(m,p.id); if(t>0) gio++;
          min += t; g += evCount(m,p.id,"g"); a += evCount(m,p.id,"a"); });
        return [p.last, p.first, p.num ? Number(p.num) : "", p.cert || "",
          tot, ok, tot ? Math.round(ok/tot*100) : "", gio, min,
          gio ? Math.round(min/gio) : 0, g, a];
      }),
    };
    cum.total = ["Totali","","","", "", "", "", "",
      cum.body.reduce((n,x)=>n+x[8],0), "",
      cum.body.reduce((n,x)=>n+x[10],0), cum.body.reduce((n,x)=>n+x[11],0)];

    const all = {
      name: "Registro allenamenti",
      title: "Presenze agli allenamenti",
      head: ["Cognome","Nome", ...ss.map(x => dShort(x.date)), "Sedute","Presenze","Frequenza %"],
      body: r.map(p => {
        let tot = 0, ok = 0;
        const cells = ss.map(x => {
          const st = db.att[x.id]?.[p.id]?.s;
          if(st){ tot++; if(st === "P") ok++; }
          return st ? LAB[st].slice(0,1) : "";
        });
        return [p.last, p.first, ...cells, tot, ok, tot ? Math.round(ok/tot*100) : ""];
      }),
    };

    saveXlsx(`miracolifc-${slug(team().name)}-${today()}.xlsx`, [gare, reg, cum, all]);
    toast("Archivio scaricato");
  });
}

/* ============ SHEET ============ */
function sheet(html){
  document.getElementById("sheetin").innerHTML = html;
  document.getElementById("sheet").classList.add("on");
  const f = document.querySelector("#sheetin input, #sheetin textarea");
  if(f) setTimeout(()=>f.focus(), 60);
}
function closeSheet(){ document.getElementById("sheet").classList.remove("on"); }
document.addEventListener("keydown", e => { if(e.key==="Escape") closeSheet(); });

/* ============ AVVIO ============ */
if(db.teams.length && !db.teams.find(t=>t.id===db.current)) db.current = db.teams[0].id;
render();
</script>
